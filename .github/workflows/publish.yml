name: Publish to NPM
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: npm

            - name: Install dependencies 🔃
              run: npm ci

            # A release must never ship an artifact that was not verified at this
            # exact dependency resolution. Every gate below blocks the publish.
            - name: Lint 🧹
              run: npm run lint

            - name: Typecheck 🔎
              run: npm run typecheck

            - name: Test ✅
              run: npm test

            - name: Build package 🔧
              run: npm run build

            - name: Smoke-test the packed tarball 📦
              run: bash scripts/smoke-package.sh

            - name: Verify tag matches package version 🏷️
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Tag v$TAG does not match package.json version $PKG" >&2
                    exit 1
                  fi
                  echo "Tag and package version agree: $PKG"

            - name: Publish package on NPM 📦
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
