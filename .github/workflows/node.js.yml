# This workflow does a clean, lockfile-pinned install of node dependencies, then
# lints, typechecks, builds and tests across the supported Node.js release lines.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Active LTS lines plus current. See https://nodejs.org/en/about/releases/
                node-version: [20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
            - run: npm test
            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-node-${{ matrix.node-version }}
                  path: coverage

    package:
        # Verifies the published artifact actually imports, in every module format
        # we advertise. Guards against regressions like an empty or missing .d.ts.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Pack and smoke-test the tarball
              run: bash scripts/smoke-package.sh
